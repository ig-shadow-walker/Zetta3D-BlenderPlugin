schema_version = "1.0.0"

id = "zetta3d"
version = "0.1.0"
name = "Zetta 3D"
tagline = "AI 3D models, pictures, pipelines and an agent inside Blender"
maintainer = "Zetta 3D <hello@zetta3d.ai>"
type = "add-on"
website = "https://zetta3d.ai"

tags = ["3D View", "Import-Export", "Mesh"]

blender_version_min = "4.2.0"

license = ["SPDX:LicenseRef-Zetta3D-Source-Available"]
copyright = ["2026 Zetta 3D"]

[permissions]
network = "Generate, process and download your models with zetta3d.ai"
files = "Save models and pictures, read files you attach or upload"
clipboard = "Copy and paste in the agent chat, and copy links"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  ".*",
]
